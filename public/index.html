<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STB</title>
  <meta name="theme-color" content="#1b1e27" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
  />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <link rel="stylesheet" href="/styles/app.css" />
  <script src="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/dist/protobuf.min.js"></script>
</head>
<body>
  <a class="skip" href="#hud">Linii din apropiere</a>
  <div id="map"></div>
  <aside class="hud" id="hud" aria-label="Plecări">
    <div class="hud-grip" id="grip" aria-hidden="true"><span></span></div>

    <div class="hud-nearby" id="nearbyView">
      <header class="hud-top">
        <div class="hud-brand">
          <span class="hud-logo" aria-hidden="true">STB</span>
          <div class="hud-clock-wrap">
            <span class="hud-clock" id="clock">--:--:--</span>
            <span class="hud-date" id="clockDate">București</span>
          </div>
        </div>
      </header>
      <div class="field hud-search">
        <span class="hud-search-icon" aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="Caută stație sau loc" autocomplete="off" spellcheck="false" aria-label="Caută stații și locuri" />
        <button type="button" class="hud-search-clear" id="searchClear" hidden aria-label="Șterge căutarea">×</button>
      </div>
      <!-- <div class="hud-chips" id="chips" role="group" aria-label="Filtrează linii"></div> -->
      <div class="hud-board-head">
        <p class="hud-count" id="linesCount">Aștept locația…</p>
      </div>
      <p class="hud-status" id="status" aria-live="polite">Se localizează…</p>
      <div id="linesList" class="hud-list"></div>
    </div>

    <div class="hud-line" id="lineView" hidden>
      <header class="line-bar">
        <button type="button" class="line-back" id="backBtn" aria-label="Înapoi la stațiile din apropiere">
        </button>
        <span class="line-bar-route" id="lineBarRoute" hidden></span>
      </header>
      <div class="line-page" id="linePage"></div>
      <footer class="line-foot" id="lineFoot" aria-live="polite">Se încarcă linia…</footer>
    </div>
  </aside>

  <script src="/js/app.js"></script>
</body>
</html>
