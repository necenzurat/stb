<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STB</title>
  <meta name="theme-color" content="#0c0e14" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Doto:wght@500;700;900&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/dist/protobuf.min.js"></script>
  <style>
    :root {
      --void: oklch(0.145 0.012 265);
      --panel: oklch(0.19 0.014 265);
      --panel-2: oklch(0.235 0.016 265);
      --rule: oklch(0.31 0.016 265);
      --rule-soft: oklch(0.31 0.016 265 / 0.55);
      --ink: oklch(0.965 0.005 95);
      --mute: oklch(0.70 0.012 265);
      --faint: oklch(0.55 0.012 265);
      --amber: oklch(0.82 0.155 78);
      --amber-glow: oklch(0.82 0.155 78 / 0.35);
      --amber-soft: oklch(0.82 0.155 78 / 0.14);
      --you: oklch(0.66 0.20 32);
      --focus: oklch(0.82 0.155 78);
      --err: oklch(0.68 0.19 25);
      --warn: oklch(0.80 0.14 72);
      --ok: oklch(0.75 0.10 150);
      --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --display: "Doto", "Inter", system-ui, sans-serif;
      --radius: 22px;
      --radius-sm: 12px;
      --hud-stack: 0px;
      --sheet-y: 0px;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      color-scheme: dark;
    }
    body {
      font: 13px/1.45 var(--font);
      color: var(--ink);
      background: var(--void);
      -webkit-font-smoothing: antialiased;
    }
    .skip {
      position: absolute;
      z-index: 2000;
      left: 12px;
      top: 12px;
      padding: 8px 12px;
      background: var(--panel-2);
      color: var(--ink);
      font: 600 13px/1.2 var(--font);
      text-decoration: none;
      border: 1px solid var(--rule);
      border-radius: 999px;
      transform: translateY(-160%);
    }
    .skip:focus {
      transform: none;
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    #map { height: 100%; width: 100%; background: var(--void); }
    .hud {
      position: absolute;
      z-index: 1000;
      top: 12px;
      left: 12px;
      right: auto;
      width: min(372px, calc(100vw - 24px));
      max-height: min(44rem, calc(100dvh - 5.5rem));
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--rule-soft);
      border-radius: var(--radius);
      box-shadow:
        0 1px 2px oklch(0.05 0.01 265 / 0.5),
        0 24px 60px oklch(0.05 0.01 265 / 0.6);
      overflow: hidden;
      color: var(--ink);
    }
    .hud-grip { display: none; }
    .hud-top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px 6px;
    }
    .hud-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .hud-logo {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--amber);
      color: oklch(0.16 0.02 265);
      font: 800 11px/1 var(--font);
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .hud-clock-wrap { display: flex; flex-direction: column; min-width: 0; }
    .hud-clock {
      font-family: var(--display);
      font-size: 21px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.03em;
      color: var(--amber);
      text-shadow: 0 0 16px var(--amber-glow);
      font-variant-numeric: tabular-nums;
    }
    .hud-date {
      margin-top: 2px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .hud-back {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      min-height: 40px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--ink);
      font: 600 12px/1 var(--font);
      cursor: pointer;
      flex-shrink: 0;
    }
    .hud-back:not([hidden]) { display: inline-flex; }
    .hud-back-chevron { font-size: 15px; line-height: 1; }
    .hud-back:focus-visible,
    .line-main:focus-visible,
    .line-fav:focus-visible,
    .place-row:focus-visible,
    .stop-line:focus-visible,
    .dir-btn:focus-visible,
    .seq-row:focus-visible,
    .chip:focus-visible,
    .fav-btn:focus-visible,
    .vehicle-no:focus-visible,
    .hud-search-clear:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .hud-search {
      position: relative;
      display: flex;
      align-items: center;
      margin: 8px 16px 0;
      background: var(--void);
      border: 1px solid var(--rule);
      border-radius: 12px;
    }
    .hud-search-icon {
      position: absolute;
      left: 12px;
      font-size: 16px;
      color: var(--faint);
      pointer-events: none;
    }
    .hud-search input {
      flex: 1;
      min-width: 0;
      padding: 11px 38px 11px 34px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font: 500 14px/1.2 var(--font);
      outline: none;
    }
    .hud-search input::placeholder { color: var(--faint); }
    .hud-search-clear {
      position: absolute;
      right: 4px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--mute);
      font: 400 20px/1 var(--font);
      cursor: pointer;
    }
    .hud-search-clear:hover { color: var(--ink); }
    .hud-chips {
      display: flex;
      gap: 6px;
      padding: 10px 16px 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .hud-chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 7px 12px;
      border: 1px solid var(--rule);
      border-radius: 999px;
      background: transparent;
      color: var(--mute);
      font: 600 12px/1 var(--font);
      letter-spacing: 0.01em;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:hover { color: var(--ink); border-color: var(--faint); }
    .chip.on {
      background: var(--amber);
      border-color: var(--amber);
      color: oklch(0.16 0.02 265);
    }
    .chip.chip-saved.on {
      background: var(--panel-2);
      border-color: var(--amber);
      color: var(--amber);
    }
    .hud-board-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 18px 6px;
    }
    .hud h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .hud-count {
      margin: 0;
      color: var(--faint);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .hud-count.err { color: var(--err); }
    .hud-status {
      margin: 0;
      padding: 0 18px 8px;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--faint);
    }
    .hud-status .count { color: var(--amber); font-weight: 700; }
    .hud-status.warn { color: var(--warn); font-weight: 600; }
    .hud-status.err { color: var(--err); font-weight: 600; }
    .hud-empty {
      padding: 8px 18px 20px;
      color: var(--mute);
      font-size: 13px;
      line-height: 1.5;
    }
    .hud-list {
      min-height: 0;
      max-height: 30rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 0 10px 14px;
      -webkit-overflow-scrolling: touch;
    }
    .line-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 14px;
      background: var(--panel-2);
      overflow: hidden;
    }
    .line-row.selected { border-color: var(--amber); background: var(--amber-soft); }
    .line-main {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 56px;
      padding: 9px 8px 9px 10px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    @media (hover: hover) {
      .line-row:hover { background: var(--rule-soft); }
      .hud-back:hover { background: var(--rule); }
    }
    @media (hover: none) {
      .line-main:active { background: var(--rule-soft); }
    }
    .line-bullet,
    .stop-bullet {
      min-width: 2.9em;
      padding: 6px 8px;
      border-radius: 9px;
      font-family: var(--font);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      flex-shrink: 0;
    }
    .line-mid,
    .stop-dest { min-width: 0; display: block; }
    .line-dest,
    .stop-dest-name {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.25;
      overflow: hidden;
      color: var(--ink);
    }
    .line-dest {
      white-space: nowrap;
      text-overflow: ellipsis;
      display: block;
    }
    .stop-dest-name {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .line-kind {
      display: block;
      color: var(--faint);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 2px;
    }
    .line-eta,
    .stop-eta {
      text-align: right;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .eta-val {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
      font-family: var(--display);
      font-size: 26px;
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: 0.01em;
      color: var(--amber);
      text-shadow: 0 0 18px var(--amber-glow);
    }
    .eta-val.is-sked { color: var(--mute); text-shadow: none; }
    .eta-val.is-now { font-size: 22px; letter-spacing: 0.05em; }
    .eta-num { font-variant-numeric: tabular-nums; }
    .eta-unit {
      font-family: var(--font);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .eta-dash {
      font-family: var(--display);
      font-size: 24px;
      font-weight: 700;
      color: var(--faint);
    }
    .eta-flag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--faint);
    }
    .stop-eta-more {
      font-family: var(--display);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--faint);
    }
    @media (prefers-reduced-motion: no-preference) {
      .eta-val.is-now { animation: now-pulse 1.6s ease-in-out infinite; }
    }
    @keyframes now-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    .line-fav,
    .fav-btn {
      display: grid;
      place-items: center;
      width: 44px;
      min-height: 56px;
      border: 0;
      background: transparent;
      color: var(--faint);
      font-size: 17px;
      cursor: pointer;
    }
    .line-fav.on { color: var(--amber); }
    .line-fav:hover { color: var(--ink); }
    .line-fav.on:hover { color: var(--amber); }
    .place-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 56px;
      padding: 10px 12px;
      border: 0;
      border-radius: 14px;
      background: var(--panel-2);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .place-row:hover { background: var(--rule-soft); }
    .place-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--void);
      border: 1px solid var(--rule);
      color: var(--amber);
      font: 700 12px/1 var(--font);
      flex-shrink: 0;
    }
    .place-mid { min-width: 0; display: block; }
    .place-name {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .place-desc {
      display: block;
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--faint);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail { display: flex; flex-direction: column; gap: 12px; padding: 4px 8px 8px; }
    .detail-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }
    .detail-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; min-width: 0; }
    .fav-btn {
      width: 40px;
      min-height: 40px;
      border-radius: 11px;
      border: 1px solid var(--rule);
      background: var(--void);
    }
    .fav-btn.on { color: var(--amber); border-color: var(--amber); }
    .detail-meta {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
    }
    .dir-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 3px;
      background: var(--void);
      border: 1px solid var(--rule);
      border-radius: 12px;
    }
    .dir-btn {
      padding: 9px 8px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--mute);
      font: 600 11.5px/1.2 var(--font);
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dir-btn.active { background: var(--panel-2); color: var(--ink); }
    .dir-btn:hover:not(.active) { color: var(--ink); }
    .stop-seq {
      list-style: none;
      margin: 0;
      padding: 0 0 0 4px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .stop-seq::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 14px;
      bottom: 14px;
      width: 2px;
      background: var(--rule);
      border-radius: 2px;
    }
    .stop-seq li { position: relative; }
    .seq-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 44px;
      padding: 8px 10px 8px 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .seq-row:hover { background: var(--rule-soft); }
    .seq-dot {
      width: 10px;
      height: 10px;
      margin-left: 8px;
      border-radius: 50%;
      background: var(--ink);
      border: 3px solid var(--panel-2);
      box-shadow: 0 0 0 1px var(--rule);
      flex-shrink: 0;
    }
    .seq-name {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--mute);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .maplibregl-popup-content {
      color: var(--ink);
      background: var(--panel);
      border-radius: 16px;
      border: 1px solid var(--rule);
      box-shadow:
        0 1px 2px oklch(0.05 0.01 265 / 0.5),
        0 20px 50px oklch(0.05 0.01 265 / 0.65);
      padding: 12px 14px;
      font-family: var(--font);
    }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--panel); }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--panel); }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--panel); }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--panel); }
    .popup-name { font-weight: 700; margin-bottom: 2px; }
    .popup-meta { font-size: 12px; color: var(--mute); }

    .stop-popup-wrap .maplibregl-popup-content {
      margin: 0;
      padding: 0;
      min-width: 268px;
      width: 300px;
    }
    .stop-popup-wrap .maplibregl-popup-close-button {
      top: 8px;
      right: 6px;
      width: 32px;
      height: 32px;
      padding: 0;
      display: grid;
      place-items: center;
      color: var(--mute);
      font: 400 20px/1 var(--font);
      background: transparent;
    }
    .stop-popup-wrap .maplibregl-popup-close-button:hover {
      color: var(--ink);
      background: transparent;
    }
    .stop-popup-wrap.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
    .stop-popup-wrap.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
    .stop-popup-wrap.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip {
      border-top-color: var(--panel);
    }
    .stop-popup-wrap.maplibregl-popup-anchor-top .maplibregl-popup-tip,
    .stop-popup-wrap.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
    .stop-popup-wrap.maplibregl-popup-anchor-top-right .maplibregl-popup-tip {
      border-bottom-color: var(--panel);
    }
    .stop-popup {
      max-height: min(56vh, 380px);
      overflow-y: auto;
    }
    .stop-head { padding: 16px 46px 12px 16px; }
    .stop-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .stop-street {
      margin-top: 3px;
      font-size: 11.5px;
      color: var(--faint);
    }
    .stop-board {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--rule);
    }
    .stop-line {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px 12px;
      align-items: center;
      width: calc(100% - 16px);
      margin: 0 8px;
      padding: 11px 8px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .stop-line:hover { background: var(--rule-soft); }
    .stop-note { padding: 12px 16px 18px; font-size: 13px; color: var(--mute); }
    .stop-note.is-err { color: var(--err); }
    .stop-skel {
      height: 46px;
      margin: 0 16px 8px;
      border-radius: 12px;
      background: var(--panel-2);
    }
    @media (prefers-reduced-motion: no-preference) {
      .stop-skel { animation: stop-skel 1.1s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    }
    @keyframes stop-skel {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.42; }
    }
    .vehicle-no {
      width: auto;
      height: auto;
      cursor: pointer;
      overflow: visible;
      --veh: oklch(0.82 0.155 78);
      --veh-ink: oklch(0.16 0.02 265);
      --veh-delay: 0s;
    }
    .vehicle-no:focus-visible {
      outline-offset: 3px;
    }
    .vehicle-mark {
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      overflow: visible;
    }
    .vehicle-beacon {
      position: relative;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      overflow: visible;
    }
    .vehicle-beacon::before,
    .vehicle-beacon::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--veh);
      background: transparent;
      opacity: 0;
      pointer-events: none;
    }
    .vehicle-icon {
      position: relative;
      z-index: 1;
      display: block;
      width: 16px;
      height: 16px;
    }
    .vehicle-icon.has-heading {
      transform: rotate(var(--veh-brg, 0deg));
    }
    .vehicle-arrow {
      display: none;
      position: absolute;
      left: 50%;
      top: -8px;
      width: 0;
      height: 0;
      margin-left: -6px;
      border-left: 6px solid transparent;

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "hud-status" + (kind ? " " + kind : "");
    }

    function uuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      const b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
      return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
    }

    function getAppId() {
      let id = localStorage.getItem(LS_APP);
      if (!id) {
        id = uuid();
        localStorage.setItem(LS_APP, id);
      }
      return id;
    }

    function deviceName() {
      const ua = navigator.userAgent;
      if (ua.includes("Firefox")) return "Firefox";
      if (ua.includes("Edg/")) return "Edge";
      if (ua.includes("Chrome")) return "Chrome";
      if (ua.includes("Safari")) return "Safari";
      return "Web";
    }

    function deviceHeaders(extra) {
      const h = {
        "App-Id": getAppId(),
        "OS-Type": "Web",
        "App-Version": "2.6.0",
        "Device-Name": deviceName(),
        "OS-Version": navigator.appVersion || "5.0",
        Lang: "ro",
        Source: "ro.radcom.smartcity.web",
      };
      const token = localStorage.getItem(LS_TOKEN);
      if (token) h["User-Info"] = token;
      Object.assign(h, extra || {});
      return h;
    }

    async function rawFetch(path, extraHeaders) {
      const res = await fetch(BASE + path, { headers: deviceHeaders(extraHeaders) });
      const buf = await res.arrayBuffer();
      return { res, buf };
    }

    function bufText(buf) {
      return new TextDecoder().decode(buf);
    }

    async function requestToken() {
      setStatus("Auth…");
      const headers = deviceHeaders({ "App-key": APP_KEY });
      delete headers["User-Info"];
      const res = await fetch(BASE + "/proxy/user/auth", { headers });
      const buf = await res.arrayBuffer();
      const text = bufText(buf);
      if (!res.ok) {
        const err = new Error("auth " + res.status);
        err.status = res.status;
        err.body = text;
        throw err;
      }
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        const err = new Error("auth not json");
        err.status = res.status;
        err.body = text;
        throw err;
      }
      const token = json && json.data && json.data.userInfo;
      if (!token) throw new Error("auth missing userInfo");
      localStorage.setItem(LS_TOKEN, token);
      return token;
    }

    function ensureToken() {
      const existing = localStorage.getItem(LS_TOKEN);
      if (existing) return Promise.resolve(existing);
      if (authPromise) return authPromise;
      authPromise = requestToken().catch((e) => {
        authPromise = null;
        throw e;
      });
      return authPromise;
    }

    function refreshToken() {
      if (tokenRefresh) return tokenRefresh;
      localStorage.removeItem(LS_TOKEN);
      authPromise = null;
      tokenRefresh = ensureToken().finally(() => {
        tokenRefresh = null;
      });
      return tokenRefresh;
    }

    async function apiFetch(path, extraHeaders, retried) {
      await ensureToken();
      const { res, buf } = await rawFetch(path, extraHeaders);
      if (res.status === 412 && !retried) {
        await refreshToken();
        return apiFetch(path, extraHeaders, true);
      }
      if (!res.ok) {
        const err = new Error(path + " " + res.status);
        err.status = res.status;
        err.body = bufText(buf);
        throw err;
      }
      return buf;
    }

    function parseBoundsPath(bounds) {
      const sw = bounds.getSouthWest();
      const ne = bounds.getNorthEast();
      return [sw.lat, sw.lng, ne.lat, ne.lng].join("/");
    }

    function prefersReducedMotion() {
      return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function emptyFC() {
      return { type: "FeatureCollection", features: [] };
    }

    function setSourceData(id, data) {
      const src = map && map.getSource(id);
      if (src) src.setData(data || emptyFC());
    }

    function boundsFromLngLats(lngLats) {
      const b = new maplibregl.LngLatBounds();
      (lngLats || []).forEach((ll) => {
        if (ll && Number.isFinite(ll[0]) && Number.isFinite(ll[1])) b.extend(ll);
      });
      return b;
    }

    function isCompactLayout() {
      return window.matchMedia("(max-width: 719px), (orientation: landscape) and (max-height: 560px)").matches;
    }

    function overlayPadding() {
      const hud = hudEl.getBoundingClientRect();
      const gap = 12;
      if (isCompactLayout()) {
        const stack = Math.max(0, Math.round(window.innerHeight - hud.top));
        document.documentElement.style.setProperty("--hud-stack", stack + "px");
        return {
          top: 8,
          left: 8,
          right: 8,
          bottom: Math.max(8, stack + gap),
        };
      }
      document.documentElement.style.setProperty("--hud-stack", "0px");
      return {
        top: 8,
        right: 8,
        bottom: 8,
        left: Math.max(8, Math.round(hud.right) + gap),
      };
    }

    function syncMapPadding() {
      if (!map) return;
      try {
        map.setPadding(overlayPadding());
      } catch (err) {}
    }

    function fitMapBounds(bounds, pad, maxZoom) {
      if (!bounds || bounds.isEmpty()) return;
      syncMapPadding();
      map.fitBounds(bounds, {
        padding: 32,
        maxZoom: maxZoom || MAP_ZOOM.fitBoundsMaximum,
        duration: prefersReducedMotion() ? 0 : 500,
      });
    }

    function accuracyPolygon(lng, lat, radiusM) {
      const steps = 64;
      const coords = [];
      const dLat = radiusM / 111320;
      const dLng = radiusM / (111320 * Math.cos((lat * Math.PI) / 180));
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * 2 * Math.PI;
        coords.push([lng + dLng * Math.cos(t), lat + dLat * Math.sin(t)]);
      }
      return { type: "Polygon", coordinates: [coords] };
    }

    function closeStopPopup() {
      if (stopPopup) {
        stopPopup.remove();
        stopPopup = null;
        stopPopupHandle = null;
      }
    }

    function setPopupContent(popup, content) {
      if (!popup) return;
      if (typeof content === "string") popup.setHTML(content);
      else popup.setDOMContent(content);
    }

    function makePopupHandle(popup) {
      return {
        getPopup: () => popup,
        isPopupOpen: () => !!(popup && popup.isOpen()),
        _stopFetchGen: 0,
      };
    }

    function keepPopupInView(popup) {
      const el = popup && popup.getElement && popup.getElement();
      if (!el || !isCompactLayout()) return;
      const inset = 8;
      const hudTop = hudEl.getBoundingClientRect().top;
      const board = el.querySelector(".stop-popup");
      if (board) {
        board.style.maxHeight = Math.max(140, hudTop - inset * 2 - 56) + "px";
      }
      el.style.marginLeft = "";
      el.style.marginTop = "";
      const r = el.getBoundingClientRect();
      let x = 0;
      let y = 0;
      if (r.left < inset) x = inset - r.left;
      else if (r.right > window.innerWidth - inset) x = window.innerWidth - inset - r.right;
      if (r.top < inset) y = inset - r.top;
      else if (r.bottom > hudTop - inset) y = hudTop - inset - r.bottom;
      el.style.marginLeft = x ? x + "px" : "";
      el.style.marginTop = y ? y + "px" : "";
    }

      const popup = new maplibregl.Popup({

        .setLngLat(lngLat)
