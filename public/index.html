<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STB</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.19.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.4.0/dist/protobuf.min.js"></script>
  <style>
    :root {
      --bg: oklch(0.16 0.012 88);
      --hud: oklch(0.22 0.02 88);
      --hud-ink: oklch(0.93 0.018 88);
      --hud-mute: oklch(0.72 0.022 88);
      --hud-rule: oklch(0.34 0.018 88);
      --hud-hover: oklch(0.28 0.022 88);
      --hud-pick: oklch(0.3 0.028 88);
      --text: var(--hud-ink);
      --muted: var(--hud-mute);
      --accent: oklch(0.78 0.13 88);
      --warn: oklch(0.78 0.14 75);
      --err: oklch(0.68 0.15 25);
      --hud-stack: 0px;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
    }
    body {
      font: 14px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      color: var(--hud-ink);
      background: var(--bg);
    }
    #map { height: 100%; width: 100%; }
    .hud {
      position: absolute;
      z-index: 1000;
      top: 12px;
      right: 12px;
      left: auto;
      width: min(268px, calc(100vw - 24px));
      max-height: min(32rem, calc(100dvh - 24px));
      display: flex;
      flex-direction: column;
      background: var(--hud);
      border: 1px solid var(--hud-rule);
      border-radius: 6px;
      box-shadow: 0 10px 28px oklch(0.14 0.02 88 / 0.45);
      overflow: hidden;
    }
    .hud-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      margin: 0;
      padding: 8px 12px;
      border-bottom: 1px solid var(--hud-rule);
    }
    .hud-status {
      min-width: 0;
      flex: 1;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.3;
      letter-spacing: 0.01em;
    }
    .hud-status.ok { color: var(--hud-ink); }
    .hud-status.warn { color: var(--warn); }
    .hud-status.err { color: var(--err); }
    .hud-board-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 12px 4px;
    }
    .hud h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    .hud-count {
      margin: 0;
      color: var(--hud-mute);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .hud-count.err { color: var(--err); }
    .hud-empty {
      padding: 8px 12px 14px;
      color: var(--hud-mute);
      font-size: 12px;
      line-height: 1.4;
    }
    .hud-back {
      display: none;
      align-items: center;
      gap: 4px;
      margin: 0 0 0 -6px;
      padding: 8px 8px;
      min-height: 44px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      flex-shrink: 0;
    }
    .hud-back:not([hidden]) { display: inline-flex; }
    .hud-back:focus-visible,
    .line-row:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .hud-back-chevron {
      font-size: 15px;
      line-height: 1;
      margin-inline-start: -0.05em;
    }
    .hud-list {
      min-height: 0;
      max-height: 22.5rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      display: flex;
      flex-direction: column;
      padding: 0 0 6px;
      -webkit-overflow-scrolling: touch;
    }
    .hud.is-line .hud-list { max-height: 14.5rem; }
    .line-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 44px;
      margin: 0;
      padding: 6px 12px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    @media (hover: hover) {
      .hud-back:hover { background: var(--hud-hover); }
      .line-row:hover { background: var(--hud-hover); }
    }
    .line-row.selected { background: var(--hud-pick); }
    .line-bullet {
      min-width: 2.75em;
      padding: 4px 7px;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .line-kind {
      color: var(--hud-mute);
      font-size: 12px;
      font-weight: 550;
      letter-spacing: 0.01em;
    }
    .line-row.selected .line-kind { color: var(--hud-ink); }
    .maplibregl-popup-content {
      color: oklch(0.28 0.03 250);
      background: oklch(0.965 0.014 92);
      border-radius: 4px;
      border: 1px solid oklch(0.88 0.02 92);
      box-shadow: 0 10px 28px oklch(0.28 0.04 250 / 0.28);
      padding: 10px 12px;
    }
    .popup-name { font-weight: 650; margin-bottom: 2px; }
    .popup-meta { font-size: 12px; color: oklch(0.5 0.02 250); }

    .stop-popup-wrap .maplibregl-popup-content {
      margin: 0;
      padding: 0;
      min-width: 252px;
      width: 280px;
    }
    .stop-popup-wrap .maplibregl-popup-close-button {
      top: 8px;
      right: 6px;
      width: 28px;
      height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      color: oklch(0.48 0.02 250);
      font: 600 18px/1 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      background: transparent;
    }
    .stop-popup-wrap .maplibregl-popup-close-button:hover {
      color: oklch(0.28 0.03 250);
      background: transparent;
    }
    .stop-popup-wrap.maplibregl-popup-anchor-bottom .maplibregl-popup-tip,
    .stop-popup-wrap.maplibregl-popup-anchor-bottom-left .maplibregl-popup-tip,
    .stop-popup-wrap.maplibregl-popup-anchor-bottom-right .maplibregl-popup-tip {
      border-top-color: oklch(0.965 0.014 92);
    }
    .stop-popup-wrap.maplibregl-popup-anchor-top .maplibregl-popup-tip,
    .stop-popup-wrap.maplibregl-popup-anchor-top-left .maplibregl-popup-tip,
    .stop-popup-wrap.maplibregl-popup-anchor-top-right .maplibregl-popup-tip {
      border-bottom-color: oklch(0.965 0.014 92);
    }
    .stop-popup {
      max-height: min(52vh, 340px);
      overflow-y: auto;
    }
    .stop-head {
      padding: 14px 40px 10px 14px;
    }
    .stop-title {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.015em;
      line-height: 1.25;
    }
    .stop-street {
      margin-top: 3px;
      font-size: 12px;
      color: oklch(0.5 0.02 250);
    }
    .stop-board {
      display: flex;
      flex-direction: column;
      border-top: 1px solid oklch(0.9 0.016 92);
    }
    .stop-line {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 8px 12px;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 10px 14px;
      border: 0;
      border-bottom: 1px solid oklch(0.92 0.012 92);
      border-radius: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .stop-line:last-child { border-bottom: 0; }
    .stop-line:hover { background: oklch(0.94 0.016 92); }
    .stop-line:focus-visible {
      outline: 2px solid oklch(0.5 0.12 155);
      outline-offset: -2px;
    }
    .stop-bullet {
      min-width: 2.75em;
      padding: 4px 7px;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }
    .stop-dest { min-width: 0; }
    .stop-dest-name {
      font-size: 13px;
      font-weight: 550;
      line-height: 1.25;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .stop-eta {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .stop-eta-next {
      font-size: 15px;
      font-weight: 700;
      color: oklch(0.4 0.12 155);
      line-height: 1.1;
    }
    .stop-eta-next.is-sked {
      color: oklch(0.42 0.05 70);
      font-weight: 650;
    }
    .stop-eta-more {
      margin-top: 2px;
      font-size: 11px;
      color: oklch(0.5 0.02 250);
    }
    .stop-eta-flag {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      color: oklch(0.5 0.04 70);
    }
    .stop-note {
      padding: 12px 14px 16px;
      font-size: 13px;
      color: oklch(0.48 0.02 250);
    }
    .stop-note.is-err { color: oklch(0.48 0.14 25); }
    .stop-skel {
      height: 42px;
      margin: 0 14px 8px;
      border-radius: 3px;
      background: oklch(0.93 0.012 92);
    }
    @media (prefers-reduced-motion: no-preference) {
      .stop-skel { animation: stop-skel 1.1s ease-out infinite; }
    }
    @keyframes stop-skel {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.42; }
    }
    .vehicle-no {
      width: auto;
      height: auto;
      cursor: pointer;
      overflow: visible;
    }
    .vehicle-mark {
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      overflow: visible;
    }
    .vehicle-beacon {
      --veh: #ff3b00;
      --veh-delay: 0s;
      position: relative;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      overflow: visible;
    }
    .vehicle-beacon::before,
    .vehicle-beacon::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--veh);
      background: transparent;
      opacity: 0;
      pointer-events: none;
    }
    .vehicle-icon {
      position: relative;
      z-index: 1;
      display: block;
      width: 16px;
      height: 16px;
    }
    .vehicle-icon.has-heading {
      transform: rotate(var(--veh-brg, 0deg));
    }
    .vehicle-arrow {
      display: none;
      position: absolute;
      left: 50%;
      top: -8px;
      width: 0;
      height: 0;
      margin-left: -6px;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 9px solid var(--veh);
      filter: drop-shadow(0 0 0.5px #111);
      z-index: 2;
    }
    .vehicle-icon.has-heading .vehicle-arrow { display: block; }
    .vehicle-dot {
      position: relative;
      z-index: 1;
      display: block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--veh);
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #111, 0 1px 6px rgba(0, 0, 0, 0.55);
    }
    @media (prefers-reduced-motion: no-preference) {
      .vehicle-beacon::before,
      .vehicle-beacon::after {
        animation: vehicle-ping 2s cubic-bezier(0.12, 0.6, 0.3, 1) infinite;
        animation-delay: var(--veh-delay);
      }
      .vehicle-beacon::after {
        animation-delay: calc(var(--veh-delay) + 1s);
      }
    }
    @keyframes vehicle-ping {
      0% { transform: scale(1); opacity: 0.85; }
      75%, 100% { transform: scale(2.9); opacity: 0; }
    }
    .vehicle-code {
      background: #111;
      color: #fff;
      font: 650 11px/1.2 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
      white-space: nowrap;
    }
    .vehicle-no.selected .vehicle-dot,
    .vehicle-no.selected .vehicle-code {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .maplibregl-ctrl-bottom-right {
      right: 8px;
      bottom: 8px;
    }
    .maplibregl-ctrl-bottom-left {
      left: 8px;
      bottom: 8px;
    }
    @media (max-width: 719px), (orientation: landscape) and (max-height: 560px) {
      .hud {
        top: auto;
        right: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        max-width: none;
        max-height: min(42dvh, calc(100dvh - 5.5rem));
        border-radius: 14px 14px 0 0;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
        padding-right: env(safe-area-inset-right, 0px);
      }
      .hud.is-line {
        max-height: min(34dvh, calc(100dvh - 7rem));
      }
      .hud-list,
      .hud.is-line .hud-list {
        max-height: none;
        flex: 1 1 auto;
      }
      .maplibregl-ctrl-bottom-right {
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        bottom: auto;
      }
      .maplibregl-ctrl-bottom-left {
        left: max(8px, env(safe-area-inset-left));
        bottom: calc(var(--hud-stack, 42dvh) + 8px);
      }
      .maplibregl-popup {
        max-width: calc(100vw - 24px) !important;
      }
      .stop-popup-wrap .maplibregl-popup-content {
        min-width: 0;
        width: min(280px, calc(100vw - 16px));
      }
      .stop-popup-wrap .maplibregl-popup-close-button {
        top: 2px;
        right: 2px;
        width: 44px;
        height: 44px;
      }
      .stop-popup {
        max-height: min(32dvh, calc(100dvh - var(--hud-stack, 42dvh) - 5.5rem));
      }
      .stop-line {
        min-height: 48px;
        padding: 12px 14px;
      }
    }
    @media (orientation: landscape) and (max-height: 560px) {
      .hud,
      .hud.is-line {
        max-height: min(48dvh, calc(100dvh - 3rem));
      }
    }
    @media (hover: none) {
      .line-row:active { background: var(--hud-hover); }
      .line-row.selected:active { background: var(--hud-pick); }
      .stop-line:active { background: oklch(0.94 0.016 92); }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <aside class="hud" id="hud" aria-label="Nearby lines">
    <div class="hud-bar">
      <button type="button" class="hud-back" id="backBtn" hidden aria-label="Back to nearby stops">
        <span class="hud-back-chevron" aria-hidden="true">←</span>
        Back
      </button>
      <p class="hud-status" id="status">Locating…</p>
    </div>
    <div class="hud-board-head">
      <h1>Nearby</h1>
      <p class="hud-count" id="linesCount">Waiting for location…</p>
    </div>
    <div id="linesList" class="hud-list"></div>
  </aside>

  <script>
    const BASE = "/api/web/v2-6";
    const APP_KEY = "gcALgRyZHC,qFonZ=Jde";
    const CITY = { lat: 44.4353308, lng: 26.0996553, zoom: 17 };
    const MIN_ZOOM = 10;
    const LS_APP = "appId";
    const LS_TOKEN = "userInfo";

    const PROTO = `
syntax = "proto2";
package ro.radcom.rp.protofiles.generate;

message ResponseGetHomeStopsDTO { repeated StopDTO stops = 1; }

message Organization {
  optional int64 id = 1; optional string code = 2; optional string name = 3;
  optional string logo_file = 4; optional string logo = 5; optional bool is_active = 6; optional bool selected = 7;
}

message TicketOfficeSchedule { optional string weekday = 1; optional string saturday = 2; optional string sunday = 3; }

message TicketOfficeDTO {
  optional TicketOfficeSchedule ticketOfficeSchedule = 1; optional string type = 2; optional string name = 3;
  optional string description = 4; optional double lat = 5; optional double lng = 6; optional int64 id = 7;
  optional string icon_color = 8; optional string photo_url = 9;
}

message HoursDTO { optional string hour = 1; repeated string minutes = 2; }
message TimesDTO { optional bool timetable = 1; optional int64 arrivingTime = 2; optional bool has_disability = 3; }

message LineDTO {
  optional int64 id = 1; optional string name = 2; optional string type = 3; optional string color = 4;
  optional string description = 5; optional int32 direction = 6; optional string direction_name = 7;
  optional int64 arriving_time = 8; repeated TimesDTO arriving_times = 9; optional bool is_timetable = 10;
  repeated HoursDTO timetable = 11; optional Organization organization = 12; optional bool has_disability = 13;
}

message StopDTO {
  optional int64 id = 1; optional double lat = 2; optional double lng = 3;
  optional string name = 4; optional string description = 5; optional string type = 6;
  optional int64 favorite_id = 7; optional TicketOfficeDTO ticket_office_type = 8;
  repeated LineDTO lines = 9; optional string icon_color = 10;
}

message ResponseGetLineDTO {
  optional int64 id = 1; optional string name = 2; optional string type = 3;
  optional bool has_notifications = 4; optional string color = 5;
  optional string price_ticket_sms = 6; optional string ticket_sms = 7;
  optional Organization organization = 8; optional string segment_path = 9;
  optional string direction_name_tur = 10; optional string direction_name_retur = 11;
  repeated StopDTO stops = 12;
}

message ResponseGetLineVehiclesDTO {
  optional int64 id = 1; optional double lat = 2; optional double lng = 3; optional string code = 4;
  optional string transport_type = 5; optional bool has_disability = 6;
}

message ResponseGetVehiclesDTO {
  repeated ResponseGetLineVehiclesDTO vehicles = 1;
}

message ResponseVehiclesDTO {
  optional int64 id = 1; optional double lat = 2; optional double lng = 3;
  optional string transport_type = 4; optional bool has_disability = 5;
}

message ResponseLineDTO {
  optional string name = 1; optional int64 id = 2; optional string type = 3; optional string color = 4;
  optional string direction_name = 5; optional int64 arriving_time = 6; optional bool is_timetable = 7;
  optional int32 direction = 8; repeated TimesDTO arriving_times = 9; repeated HoursDTO timetable = 10;
  optional string segment_path = 11; repeated ResponseVehiclesDTO vehicles = 12; optional bool has_disability = 13;
}

message ResponseStopDTO {
  optional string name = 1; optional string address = 2; optional string image = 3; optional int64 favorite_id = 4;
  optional string type = 5; optional string subtype = 6; optional string schedule_weekday = 7;
  optional string schedule_saturday = 8; optional string schedule_sunday = 9;
  repeated ResponseLineDTO lines = 10; optional bool has_disability = 11;
}
`;

    const NEAREST_STOPS = 15;
    const VEHICLE_POLL_MS = 10000;
    const hudEl = document.getElementById("hud");
    const statusEl = document.getElementById("status");
    const backBtn = document.getElementById("backBtn");
    const linesCountEl = document.getElementById("linesCount");
    const linesListEl = document.getElementById("linesList");

    let protoRoot;
    let HomeStopsType;
    let LineDetailType;
    let VehiclesType;
    let userLngLat = null;
    let vehicleMarkers = [];
    let stopPopup = null;
    let stopPopupHandle = null;
    let map;
    let overlaysReady = false;
    let fittedOnce = false;
    let fetchGen = 0;
    let nearbyGen = 0;
    let vehicleGen = 0;
    let moveTimer;
    let vehicleTimer = null;
    let authPromise = null;
    let tokenRefresh = null;
    let lastStops = [];
    let lastPlottedVehicles = [];
    const stopInfoCache = new Map();
    const lineDirCache = new Map();
    let nearbyLines = [];
    let selectedLineId = null;
    let selectedLine = null;
    let selectedVehicleKey = null;
    let pathStopsOverride = null;
    let drawingLine = false;
    let dirPaths = { 0: [], 1: [] };

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = "hud-status" + (kind ? " " + kind : "");
    }

    function uuid() {
      if (crypto.randomUUID) return crypto.randomUUID();
      const b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      const h = [...b].map((x) => x.toString(16).padStart(2, "0")).join("");
      return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
    }

    function getAppId() {
      let id = localStorage.getItem(LS_APP);
      if (!id) {
        id = uuid();
        localStorage.setItem(LS_APP, id);
      }
      return id;
    }

    function deviceName() {
      const ua = navigator.userAgent;
      if (ua.includes("Firefox")) return "Firefox";
      if (ua.includes("Edg/")) return "Edge";
      if (ua.includes("Chrome")) return "Chrome";
      if (ua.includes("Safari")) return "Safari";
      return "Web";
    }

    function deviceHeaders(extra) {
      const h = {
        "App-Id": getAppId(),
        "OS-Type": "Web",
        "App-Version": "2.6.0",
        "Device-Name": deviceName(),
        "OS-Version": navigator.appVersion || "5.0",
        Lang: "ro",
        Source: "ro.radcom.smartcity.web",
      };
      const token = localStorage.getItem(LS_TOKEN);
      if (token) h["User-Info"] = token;
      Object.assign(h, extra || {});
      return h;
    }

    async function rawFetch(path, extraHeaders) {
      const res = await fetch(BASE + path, { headers: deviceHeaders(extraHeaders) });
      const buf = await res.arrayBuffer();
      return { res, buf };
    }

    function bufText(buf) {
      return new TextDecoder().decode(buf);
    }

    async function requestToken() {
      setStatus("Auth…");
      const headers = deviceHeaders({ "App-key": APP_KEY });
      delete headers["User-Info"];
      const res = await fetch(BASE + "/proxy/user/auth", { headers });
      const buf = await res.arrayBuffer();
      const text = bufText(buf);
      if (!res.ok) {
        const err = new Error("auth " + res.status);
        err.status = res.status;
        err.body = text;
        throw err;
      }
      let json;
      try {
        json = JSON.parse(text);
      } catch (e) {
        const err = new Error("auth not json");
        err.status = res.status;
        err.body = text;
        throw err;
      }
      const token = json && json.data && json.data.userInfo;
      if (!token) throw new Error("auth missing userInfo");
      localStorage.setItem(LS_TOKEN, token);
      return token;
    }

    function ensureToken() {
      const existing = localStorage.getItem(LS_TOKEN);
      if (existing) return Promise.resolve(existing);
      if (authPromise) return authPromise;
      authPromise = requestToken().catch((e) => {
        authPromise = null;
        throw e;
      });
      return authPromise;
    }

    function refreshToken() {
      if (tokenRefresh) return tokenRefresh;
      localStorage.removeItem(LS_TOKEN);
      authPromise = null;
      tokenRefresh = ensureToken().finally(() => {
        tokenRefresh = null;
      });
      return tokenRefresh;
    }

    async function apiFetch(path, extraHeaders, retried) {
      await ensureToken();
      const { res, buf } = await rawFetch(path, extraHeaders);
      if (res.status === 412 && !retried) {
        await refreshToken();
        return apiFetch(path, extraHeaders, true);
      }
      if (!res.ok) {
        const err = new Error(path + " " + res.status);
        err.status = res.status;
        err.body = bufText(buf);
        throw err;
      }
      return buf;
    }

    function parseBoundsPath(bounds) {
      const sw = bounds.getSouthWest();
      const ne = bounds.getNorthEast();
      return [sw.lat, sw.lng, ne.lat, ne.lng].join("/");
    }

    function prefersReducedMotion() {
      return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    }

    function emptyFC() {
      return { type: "FeatureCollection", features: [] };
    }

    function setSourceData(id, data) {
      const src = map && map.getSource(id);
      if (src) src.setData(data || emptyFC());

    function boundsFromLngLats(lngLats) {
      const b = new maplibregl.LngLatBounds();
      (lngLats || []).forEach((ll) => {
        if (ll && Number.isFinite(ll[0]) && Number.isFinite(ll[1])) b.extend(ll);
      });
      return b;
    }

    function isCompactLayout() {
      return window.matchMedia("(max-width: 719px), (orientation: landscape) and (max-height: 560px)").matches;
    }

    function overlayPadding() {
      const hud = hudEl.getBoundingClientRect();
      const gap = 12;
      if (isCompactLayout()) {
        const stack = Math.max(0, Math.round(window.innerHeight - hud.top));
        document.documentElement.style.setProperty("--hud-stack", stack + "px");
        return {
          top: 8,
          left: 8,
          right: 8,
          bottom: Math.max(8, stack + gap),
        };
      }
      document.documentElement.style.setProperty("--hud-stack", "0px");
      return {
        top: 8,
        left: 8,
        bottom: 8,
        right: Math.max(8, Math.round(window.innerWidth - hud.left) + gap),
      };
    }

    function syncMapPadding() {
      if (!map) return;
      try {
        map.setPadding(overlayPadding());
      } catch (err) {}
    }

    function fitMapBounds(bounds, pad, maxZoom) {
      if (!bounds || bounds.isEmpty()) return;
      syncMapPadding();
      map.fitBounds(bounds, {
        padding: 32,
        maxZoom: maxZoom || 16,
        duration: prefersReducedMotion() ? 0 : 500,
      });
    }

    function accuracyPolygon(lng, lat, radiusM) {
      const steps = 64;
      const coords = [];
      const dLat = radiusM / 111320;
      const dLng = radiusM / (111320 * Math.cos((lat * Math.PI) / 180));
      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * 2 * Math.PI;
        coords.push([lng + dLng * Math.cos(t), lat + dLat * Math.sin(t)]);
      }
      return { type: "Polygon", coordinates: [coords] };
    }

    function keepPopupInView(popup) {
      const el = popup && popup.getElement && popup.getElement();
      if (!el || !isCompactLayout()) return;
      const inset = 8;
      const hudTop = hudEl.getBoundingClientRect().top;
      const board = el.querySelector(".stop-popup");
      if (board) {
        board.style.maxHeight = Math.max(140, hudTop - inset * 2 - 56) + "px";
      }
      el.style.marginLeft = "";
      el.style.marginTop = "";
      const r = el.getBoundingClientRect();
      let x = 0;
      let y = 0;
      if (r.left < inset) x = inset - r.left;
      else if (r.right > window.innerWidth - inset) x = window.innerWidth - inset - r.right;
      if (r.top < inset) y = inset - r.top;
      else if (r.bottom > hudTop - inset) y = hudTop - inset - r.bottom;
      el.style.marginLeft = x ? x + "px" : "";
      el.style.marginTop = y ? y + "px" : "";
    }

    function formatArrivalSeconds(sec) {
      if (sec == null || sec === "") return "";
      const n = Number(sec);
      if (!Number.isFinite(n) || n < 0) return "";
      if (n < 45) return "now";
      return Math.round(n / 60) + " min";
    }

    function lineArrivals(line) {
      const times = line.arriving_times || line.arrivingTimes || [];
      const out = [];
      for (const t of times) {
        const raw = t && (t.arrivingTime != null ? t.arrivingTime : t.arriving_time);
        const label = formatArrivalSeconds(raw);
        if (!label) continue;
        out.push({
          label: label,
          scheduled: !!(t && (t.timetable || t.timetable === true)),
        });
        if (out.length >= 3) break;
      }
      if (!out.length) {
        const one = formatArrivalSeconds(line.arriving_time != null ? line.arriving_time : line.arrivingTime);
        if (one) {
          out.push({
            label: one,
            scheduled: !!(line.is_timetable || line.isTimetable),
          });
        }
      }
      return out;
    }

    function hexLuminance(hex) {
      const h = String(hex || "").replace("#", "");
      const full = h.length === 3 ? h.split("").map((c) => c + c).join("") : h;
      if (full.length < 6) return 0.45;
      const r = parseInt(full.slice(0, 2), 16) / 255;
      const g = parseInt(full.slice(2, 4), 16) / 255;
      const b = parseInt(full.slice(4, 6), 16) / 255;
      const lin = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
      return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
    }

    function inkOnHex(hex) {
      return hexLuminance(hex) > 0.55 ? "oklch(0.22 0.03 250)" : "oklch(0.98 0.012 95)";
    }

    function stopStreet(detail, name) {
      let addr = (detail && (detail.description || detail.address)) || "";
      addr = addr.replace(/,\s*Bucure[sș]ti\s*$/i, "").trim();
      if (!addr) return "";
      if (name && addr.toLowerCase() === String(name).toLowerCase()) return "";
      return addr;
    }

    function ticketOfficeNote(detail) {
      const office = detail && (detail.ticket_office || detail.ticketOffice);
      if (!office) return "";
      const sked = office.ticketOfficeSchedule || office.ticket_office_schedule || {};
      const parts = [];
      if (sked.weekday) parts.push("Weekdays " + sked.weekday);
      if (sked.saturday) parts.push("Saturday " + sked.saturday);
      if (sked.sunday) parts.push("Sunday " + sked.sunday);
      const name = office.name || office.type || "";
      if (name && parts.length) return name + " · " + parts.join(" · ");
      if (parts.length) return parts.join(" · ");
      return "";
    }

    function renderStopPopup(s, detail) {
      const wrap = document.createElement("div");

        const sub = document.createElement("div");

        sub.textContent = street;
        head.appendChild(sub);
      }
      if (detail && (detail.has_disability || detail.hasDisability)) {

        access.className = "stop-street";
        access.textContent = "Accessible";
        head.appendChild(access);
      }
      const ticket = ticketOfficeNote(detail);
      if (ticket) {
        const note = document.createElement("div");
        note.className = "stop-street";
        note.textContent = ticket;
        head.appendChild(note);
      }

      wrap.appendChild(head);

      const lines = (detail && detail.lines) || [];
      if (!lines.length) {
        const empty = document.createElement("div");
        empty.className = "stop-note";
        empty.textContent = "No departures posted.";
        wrap.appendChild(empty);
        return wrap;
      }

      const parsed = lines.map((line) => ({ line: line, arrivals: lineArrivals(line) }));
      const anyLive = parsed.some((p) => p.arrivals[0] && !p.arrivals[0].scheduled);
      const anySked = parsed.some((p) => p.arrivals[0] && p.arrivals[0].scheduled);
      if (anySked && !anyLive) {
        const flag = document.createElement("div");
        flag.className = "stop-street";
        flag.textContent = "Times from the timetable";
        head.appendChild(flag);
      }

      const board = document.createElement("div");
      board.className = "stop-board";
      for (const { line, arrivals } of parsed) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "stop-line";
        const route = line.name || "?";
        const dest = line.direction_name || line.directionName || "";
        const next = arrivals[0];
        row.setAttribute(
          "aria-label",
          "Line " + route + (dest ? " to " + dest : "") +
            (next ? ", " + next.label + (next.scheduled ? ", timetable" : "") : "")
        );

        const bullet = document.createElement("span");
        bullet.className = "stop-bullet";
        const fill = cssColor(line.color);
        bullet.style.background = fill;
        bullet.style.color = inkOnHex(fill);
        bullet.textContent = route;

        const mid = document.createElement("span");
        mid.className = "stop-dest";
        const destEl = document.createElement("div");
        destEl.className = "stop-dest-name";
        destEl.textContent = dest || (line.type || "Open line");
        mid.appendChild(destEl);
        const cap = line.current_capacity != null ? line.current_capacity : line.currentCapacity;
        if (cap != null && cap !== "") {
          const load = document.createElement("div");
          load.className = "stop-street";
          load.textContent = "Load " + cap;
          mid.appendChild(load);
        }
        const hours = line.timetable || [];
        if (hours.length) {
          const sked = document.createElement("div");
          sked.className = "stop-street";
          sked.textContent = hours
            .slice(0, 6)
            .map((h) => {
              const hour = h.hour || "";
              const mins = (h.minutes || []).join(" ");
              return mins ? hour + " " + mins : hour;
            })
            .filter(Boolean)
            .join(" · ");
          if (sked.textContent) mid.appendChild(sked);
        }

        const eta = document.createElement("span");
        eta.className = "stop-eta";
        if (next) {
          const primary = document.createElement("div");
          primary.className = "stop-eta-next" + (next.scheduled ? " is-sked" : "");
          primary.textContent = next.label;
          eta.appendChild(primary);
          const rest = arrivals.slice(1).map((a) => a.label);
          if (rest.length) {
            const more = document.createElement("div");
            more.className = "stop-eta-more";
            more.textContent = rest.join("  ");
            eta.appendChild(more);
          }
          if (next.scheduled && anyLive) {
            const flag = document.createElement("span");
            flag.className = "stop-eta-flag";
            flag.textContent = "Timetable";
            eta.appendChild(flag);
          }
        } else {
          const primary = document.createElement("div");
          primary.className = "stop-eta-next is-sked";
          primary.textContent = "none";
          eta.appendChild(primary);
        }

        row.append(bullet, mid, eta);
        if (line.id != null) {
          row.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            selectLine({
              id: line.id,
              name: line.name,
              type: line.type,
              color: line.color,
            });
          });
        }
        board.appendChild(row);
      }
      wrap.appendChild(board);
      return wrap;
    }

    async function loadStopPopup(marker, s) {
      const popup = marker.getPopup();
      if (!popup || s.id == null) return;
      marker._stopFetchGen = (marker._stopFetchGen || 0) + 1;
      const token = marker._stopFetchGen;
      try {
        const detail = await fetchStopInfo(s.id, { fresh: true });
        if (marker._stopFetchGen !== token || !marker.isPopupOpen()) return;
        if (!detail || (!(detail.lines || []).length && !detail.name)) {
          throw new Error("Could not load departures");
        }
        setPopupContent(popup, renderStopPopup(s, detail));
        keepPopupInView(popup);
      } catch (e) {
        console.error(e);
        if (marker._stopFetchGen !== token || !marker.isPopupOpen()) return;
        setPopupContent(
          popup,
          '<div class="stop-popup">' +
            '<div class="stop-head"><div class="stop-title">' +
            escapeHtml(s.name || "Stop") +
            '</div></div><div class="stop-note is-err">' +
            escapeHtml(e.message || "Could not load departures") +
            "</div></div>"
        );
        keepPopupInView(popup);
      }
    }

    function plotStops(stops, opts) {
      const features = [];

      (stops || []).forEach((s) => {
        if (typeof s.lat !== "number" || typeof s.lng !== "number") return;
        pts.push([s.lng, s.lat]);
        features.push({
          type: "Feature",
          properties: {
            id: s.id != null ? String(s.id) : "",
            name: s.name || "",
            payload: JSON.stringify(s),
          },
          geometry: { type: "Point", coordinates: [s.lng, s.lat] },
        });
      });
      setSourceData("stops", { type: "FeatureCollection", features: features });
      if (!fittedOnce && pts.length && !(opts && opts.keepView)) {
        const b = boundsFromLngLats(pts);
        if (userLngLat) b.extend([userLngLat.lng, userLngLat.lat]);
        fitMapBounds(b, 0.15);
        fittedOnce = true;
      }
      return pts.length;
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")

    function cssColor(c) {

    function haversineMeters(aLat, aLng, bLat, bLng) {
      const R = 6371000;
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(bLat - aLat);
      const dLng = toRad(bLng - aLng);
      const sinLat = Math.sin(dLat / 2);
      const sinLng = Math.sin(dLng / 2);
      const h = sinLat * sinLat + Math.cos(toRad(aLat)) * Math.cos(toRad(bLat)) * sinLng * sinLng;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
    }

    function userLatLng() {
      if (userLngLat) return userLngLat;
      return { lat: CITY.lat, lng: CITY.lng };
    }

    function nearestStops(stops, n) {
      const origin = userLatLng();
      return (stops || [])
        .filter((s) => s && s.id != null && typeof s.lat === "number" && typeof s.lng === "number")
        .map((s) => ({ s, d: haversineMeters(origin.lat, origin.lng, s.lat, s.lng) }))
        .sort((a, b) => a.d - b.d)
        .slice(0, n)
        .map((x) => x.s);
    }

    function decodePolyline(encoded) {
      if (!encoded) return [];
      const coords = [];
      let index = 0;
      let lat = 0;
      let lng = 0;
      while (index < encoded.length) {
        let b;
        let shift = 0;
        let result = 0;
        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);
        lat += result & 1 ? ~(result >> 1) : result >> 1;
        shift = 0;
        result = 0;
        do {
          b = encoded.charCodeAt(index++) - 63;
          result |= (b & 0x1f) << shift;
          shift += 5;
        } while (b >= 0x20);
        lng += result & 1 ? ~(result >> 1) : result >> 1;
        coords.push([lat / 1e5, lng / 1e5]);
      }
      return coords;
    }

    backBtn.addEventListener("click", goBackFromLine);

    function lineFromNearby(id) {
      const sid = String(id);
      return nearbyLines.find((line) => String(line.id) === sid) || null;
    }

    function applyLineFromHash() {
      const id = lineIdFromHash();
      if (!id) {
        if (selectedLineId != null) exitLine();
        else syncBackButton();
        return;
      }
      if (String(selectedLineId) === String(id) && selectedLine) return;
      const known = lineFromNearby(id) || (selectedLine && String(selectedLine.id) === String(id) ? selectedLine : null);
      return selectLine(known || { id: id });
    }

    async function loadNearbyLines(stops) {
      const gen = ++nearbyGen;
      const ranked = nearestStops(stops, NEAREST_STOPS);
      if (!ranked.length) {
        nearbyLines = [];
        setLinesCount("0");
        setLinesListMessage("No nearby stops to collect lines from.");
        return;
      }
      setLinesCount("Loading lines from " + ranked.length + " stops…");
      const byId = new Map();
      try {
        const batches = await Promise.all(
          ranked.map((stop) =>
            fetchStopLines(stop.id).catch((err) => {
              console.error("stop lines", stop.id, err);
              return [];
            })
          )
        );
        if (gen !== nearbyGen) return;
        for (const lines of batches) {
          for (const line of lines) {
            if (line == null || line.id == null) continue;
            const id = String(line.id);
            if (byId.has(id)) continue;
            byId.set(id, {
              id: line.id,
              name: line.name,
              type: line.type,
              color: line.color,
            });
          }
        }
        renderLinesList([...byId.values()]);
      } catch (e) {
        if (gen !== nearbyGen) return;
        console.error(e);
        setLinesCount((e.message || "lines failed") + (e.status ? " (" + e.status + ")" : ""), "err");
        setLinesListMessage("Could not load nearby lines.");
      }
    }

    function clearVehicles() {
      vehicleMarkers.forEach((m) => m.remove());
      vehicleMarkers = [];
    }

    function stopVehiclePoll() {
      if (vehicleTimer) {
        clearInterval(vehicleTimer);
        vehicleTimer = null;
      }
      vehicleGen += 1;
    }

    function decodeVehicles(buf) {
      const msg = VehiclesType.decode(new Uint8Array(buf));
      return VehiclesType.toObject(msg, { longs: String, defaults: true });
    }

    async function fetchVehicles(lineId, direction) {
      const path =
        "/lines/v2/" +
        encodeURIComponent(String(lineId)) +
        "/vehicles/" +
        direction +
        "?lang=ro";
      const buf = await apiFetch(path);
      return decodeVehicles(buf);
    }

    function vehicleKey(v) {
      if (v && v.id != null) return String(v.id);
      if (v && v.code != null) return String(v.code);
      return "";
    }

    function vehicleAnimDelay(key) {
      const s = String(key || "");
      let n = 0;
      for (let i = 0; i < s.length; i++) n = (n + s.charCodeAt(i) * (i + 1)) % 17;
      return (n * 0.11).toFixed(2) + "s";
    }

    function vehicleLatLng(v) {
      const lat = Number(v && (v.lat != null ? v.lat : v.latitude));
      const lng = Number(v && (v.lng != null ? v.lng : v.longitude));
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      if (Math.abs(lat) < 1e-5 && Math.abs(lng) < 1e-5) return null;
      return [lat, lng];
    }

    function distToSeg2(px, py, ax, ay, bx, by) {
      const dx = bx - ax;
      const dy = by - ay;
      const len2 = dx * dx + dy * dy;
      let t = 0;
      if (len2 > 0) t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
      const ex = px - (ax + t * dx);
      const ey = py - (ay + t * dy);
      return ex * ex + ey * ey;
    }

    function bearingDeg(lat1, lng1, lat2, lng2) {
      const r = Math.PI / 180;
      const φ1 = lat1 * r;
      const φ2 = lat2 * r;
      const Δλ = (lng2 - lng1) * r;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
    }

    function bearingOnPath(lat, lng, latlngs) {
      if (!latlngs || latlngs.length < 2) return null;
      let best = Infinity;
      let bestI = -1;
      for (let i = 0; i < latlngs.length - 1; i++) {
        const a = latlngs[i];
        const b = latlngs[i + 1];
        const d = distToSeg2(lng, lat, a[1], a[0], b[1], b[0]);
        if (d < best) {
          best = d;
          bestI = i;
        }
      }
      if (bestI < 0) return null;
      const a = latlngs[bestI];
      const b = latlngs[bestI + 1];
      return bearingDeg(a[0], a[1], b[0], b[1]);
    }

    function plotVehicles(vehicles, color, opts) {
      clearVehicles();
      const routeNo = (selectedLine && selectedLine.name) || "";
      const openKey = opts && opts.openKey;
      (vehicles || []).forEach((v) => {
        const ll = vehicleLatLng(v);
        if (!ll) return;
        const fleet = v.code != null ? String(v.code) : vehicleKey(v) || "";
        const label = routeNo || fleet || "?";
        const kind = v.transport_type || v.transportType || "";
        const access = v.has_disability || v.hasDisability ? "accessible" : "";
        const key = vehicleKey(v);
        const selected = key && key === selectedVehicleKey;
        const path = dirPaths[v.direction];
        const brg = path ? bearingOnPath(ll[0], ll[1], path) : null;
        const el = document.createElement("div");
        el.className = "vehicle-no" + (selected ? " selected" : "");
        el.tabIndex = 0;
        el.setAttribute("role", "button");
        el.setAttribute("aria-label", "Vehicle " + label + (fleet && fleet !== label ? " fleet " + fleet : ""));
        el.innerHTML =
          '<span class="vehicle-mark"><span class="vehicle-beacon" style="--veh-delay:' +
          vehicleAnimDelay(key) +
          '"><span class="vehicle-icon' +
          (brg != null ? " has-heading" : "") +
          '"' +
          (brg != null ? ' style="--veh-brg:' + brg.toFixed(1) + 'deg"' : "") +
          '><span class="vehicle-arrow"></span><span class="vehicle-dot"></span></span></span><span class="vehicle-code">' +
          escapeHtml(label) +
          "</span></span>";
        const popup = new maplibregl.Popup({ offset: 16, closeButton: false, maxWidth: "240px" }).setHTML(
          '<div class="popup-name">' +
            escapeHtml(label) +
            (fleet && fleet !== label ? " · #" + escapeHtml(fleet) : "") +
            "</div>" +
            '<div class="popup-meta">' +
            escapeHtml([kind, access].filter(Boolean).join(" · ")) +
            "</div>"
        );
        const m = new maplibregl.Marker({ element: el, anchor: "left", offset: [0, 0] })
          .setLngLat([ll[1], ll[0]])
          .setPopup(popup)
          .addTo(map);
        m._vehKey = key;
        el.addEventListener("click", (ev) => {
          ev.stopPropagation();
          showPathForVehicle(v);
        });
        el.addEventListener("keydown", (ev) => {
          if (ev.key !== "Enter" && ev.key !== " ") return;
          ev.preventDefault();
          showPathForVehicle(v);
        });
        vehicleMarkers.push(m);
        if (openKey && key === openKey) m.togglePopup();
      });
    }

    async function loadDirPaths(lineId) {
      const next = { 0: [], 1: [] };
      await Promise.all(
        [0, 1].map(async (dir) => {
          try {
            const d = await fetchLineDirection(lineId, dir);
            next[dir] = decodePolyline(segmentPathOf(d));
          } catch (err) {
            console.error("direction path", dir, err);
            next[dir] = [];
          }
        })
      );
      return next;
    }

    async function fetchLineDirection(lineId, dir) {
      const key = String(lineId) + ":" + dir;
      if (lineDirCache.has(key)) return lineDirCache.get(key);
      const detail = await fetchLineDetail(lineId, "/direction/" + dir);
      lineDirCache.set(key, detail);
      return detail;
    }

    async function lineStopsFromDetail(lineId, detail) {
      const primary = (detail && detail.stops) || [];
      if (primary.length) return primary;
      const packs = await Promise.all(
        [0, 1].map((dir) =>
          fetchLineDirection(lineId, dir).catch((err) => {
            console.error("direction stops", dir, err);
            return { stops: [] };
          })
        )
      );
      const seen = new Set();
      const out = [];
      for (const pack of packs) {
        for (const s of pack.stops || []) {
          const id = s.id != null ? String(s.id) : String(s.lat) + ":" + String(s.lng);
          if (seen.has(id)) continue;
          seen.add(id);
          out.push(s);
        }
      }
      return out;
    }

    function showPathForVehicle(v) {
      const line = selectedLine;
      if (!line) return;
      selectedVehicleKey = vehicleKey(v);
      plotVehicles(lastPlottedVehicles, line.color, { openKey: selectedVehicleKey });
    }

    async function refreshVehicles(line) {
      const gen = ++vehicleGen;
      const id = line.id;
      try {
        const packs = await Promise.all(
          [0, 1].map((dir) =>
            fetchVehicles(id, dir).catch((err) => {
              console.error("vehicles", dir, err);
              return { vehicles: [] };
            })
          )
        );
        if (gen !== vehicleGen || String(selectedLineId) !== String(id)) return;
        const list = [];
        const seen = new Set();
        packs.forEach((pack, dir) => {
          for (const v of pack.vehicles || []) {
            const key = v.id != null ? String(v.id) : v.code + ":" + v.lat + ":" + v.lng;
            if (seen.has(key)) continue;
            seen.add(key);
            list.push(Object.assign({}, v, { direction: dir }));
          }
        });
        lastPlottedVehicles = list;
        plotVehicles(list, line.color);
        setStatus(lineHeadline(line) + " · " + list.length + " vehicles", "ok");
      } catch (e) {
        if (gen !== vehicleGen) return;
        console.error(e);
      }
    }

    function startVehiclePoll(line) {
      stopVehiclePoll();
      selectedLine = line;
      refreshVehicles(line);
      vehicleTimer = setInterval(() => refreshVehicles(line), VEHICLE_POLL_MS);
    }

    function clearRoute() {
      setSourceData("route", emptyFC());
    }

    function drawRoutePaths(paths, color, opts) {
      const stroke = cssColor(color);
      const features = [];
      const lngLats = [];
      (paths || []).forEach((latlngs) => {
        if (!latlngs || latlngs.length < 2) return;
        const coords = latlngs.map((p) => [p[1], p[0]]);
        coords.forEach((c) => lngLats.push(c));
        features.push({
          type: "Feature",
          properties: { color: stroke },
          geometry: { type: "LineString", coordinates: coords },
        });
      });
      setSourceData("route", { type: "FeatureCollection", features: features });
      if (map.getLayer("route-line")) {
        map.setPaintProperty("route-line", "line-color", stroke);
      }
      if (!features.length) return false;
      if (!(opts && opts.fit === false)) {
        fitMapBounds(boundsFromLngLats(lngLats), 0.12);
      }
      return true;
    }

    async function fetchLineDetail(lineId, suffix) {
      const path = "/lines/" + encodeURIComponent(String(lineId)) + (suffix || "") + "?lang=ro";
      const buf = await apiFetch(path);
      return decodeLineDetail(buf);
    }

    async function selectLine(line) {
      if (drawingLine) return;
      const startZoom = map ? map.getZoom() : CITY.zoom;
      drawingLine = true;
      selectedLineId = line.id;
      selectedLine = line;
      selectedVehicleKey = null;
      pathStopsOverride = null;
      dirPaths = { 0: [], 1: [] };
      setLineHash(line.id);
      markSelectedRow();
      syncBackButton();
      stopVehiclePoll();
      clearVehicles();
      lastPlottedVehicles = [];
      clearStops();
      setStatus("Loading " + (line.name || line.id) + "…");
      startVehiclePoll(line);
      try {
        const detail = await fetchLineDetail(line.id);
        if (String(selectedLineId) !== String(line.id)) return;
        dirPaths = await loadDirPaths(line.id);
        if (String(selectedLineId) !== String(line.id)) return;
        const paths = [];
        const main = decodePolyline(segmentPathOf(detail));
        if (main.length) {
          paths.push(main);
        } else {
          for (const dir of [0, 1]) {
            if (dirPaths[dir] && dirPaths[dir].length) paths.push(dirPaths[dir]);
          }
        }
        const stops = await lineStopsFromDetail(line.id, detail);
        if (String(selectedLineId) !== String(line.id)) return;
        pathStopsOverride = stops;
        plotStops(pathStopsOverride, { keepView: true });
        if (detail) {
          if (!line.name && detail.name) line.name = detail.name;
          if (!line.type && detail.type) line.type = detail.type;
          if (!line.color && detail.color) line.color = detail.color;
          selectedLine = line;
          if (lastPlottedVehicles.length) plotVehicles(lastPlottedVehicles, line.color || detail.color);
        }
        const ok = drawRoutePaths(paths, line.color || detail.color, { fit: false });
        map.easeTo({
          zoom: Math.max(MIN_ZOOM, startZoom - 3),
          duration: prefersReducedMotion() ? 0 : 400,
        });
        if (!ok) {
          setStatus("No route for " + (line.name || line.id), "warn");
        } else {
          const n = lastPlottedVehicles.length;
          setStatus(
            lineHeadline(line) +
              (n ? " · " + n + " vehicles" : ""),
            "ok"
          );
        }
      } catch (e) {
        console.error(e);
        setStatus((e.message || "line failed") + (e.status ? " (" + e.status + ")" : ""), "err");
      } finally {
        drawingLine = false;
      }
    }

    async function loadStops() {
      if (map.getZoom() < MIN_ZOOM) {
        if (pathStopsOverride || selectedLineId) return;
        setStatus("Zoom in to " + MIN_ZOOM + "+ to load stops (now " + Math.round(map.getZoom()) + ")", "warn");
        clearStops();
        lastStops = [];
        setLinesCount("Zoom in");
        setLinesListMessage("Zoom in to " + MIN_ZOOM + "+ to load nearby lines.");
        return;
      }
      const gen = ++fetchGen;
      const path = "/lines/v2/home/stops/" + parseBoundsPath(map.getBounds());
      if (!selectedLineId) setStatus("Loading stops…");
      try {
        const buf = await apiFetch(path);
        if (gen !== fetchGen) return;
        const obj = decodeStops(buf);
        lastStops = obj.stops || [];
        if (pathStopsOverride) {
          plotStops(pathStopsOverride, { keepView: true });
        } else if (selectedLineId) {
          clearStops();
        } else {
          const n = plotStops(lastStops);
          statusEl.innerHTML = '<span class="count">' + n + "</span> nearby stops";
          statusEl.className = "hud-status ok";
        }
        await loadNearbyLines(lastStops);
      } catch (e) {
        if (gen !== fetchGen) return;
        console.error(e);
        setStatus((e.message || "load failed") + (e.status ? " (" + e.status + ")" : ""), "err");
        setLinesCount((e.message || "load failed"), "err");
      }
    }

    function setUserLoc(lat, lng, accuracy) {
      userLngLat = { lat: lat, lng: lng };
      const features = [
        {
          type: "Feature",
          properties: { kind: "you" },
          geometry: { type: "Point", coordinates: [lng, lat] },
        },
      ];
      if (accuracy && Number.isFinite(accuracy) && accuracy > 8) {
        features.unshift({
          type: "Feature",
          properties: { kind: "accuracy" },
          geometry: accuracyPolygon(lng, lat, accuracy),
        });
      }
      setSourceData("user", { type: "FeatureCollection", features: features });
    }

    function locate() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ lat: CITY.lat, lng: CITY.lng, acc: null, fallback: true, reason: "no geolocation API" });
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolve({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              acc: pos.coords.accuracy,
              fallback: false,
            });
          },
          (err) => {
            resolve({
              lat: CITY.lat,
              lng: CITY.lng,
              acc: null,
              fallback: true,
              reason: err && err.message ? err.message : "denied",
            });
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
      });
    }

    function ensureOverlayLayers() {
      if (overlaysReady) return;
      map.addSource("route", { type: "geojson", data: emptyFC() });
      map.addLayer({
        id: "route-casing",
        type: "line",
        source: "route",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#ffffff", "line-width": 7, "line-opacity": 0.9 },
      });
      map.addLayer({
        id: "route-line",
        type: "line",
        source: "route",
        layout: { "line-join": "round", "line-cap": "round" },
        paint: { "line-color": "#888888", "line-width": 4, "line-opacity": 0.94 },
      });
      map.addSource("stops", { type: "geojson", data: emptyFC() });
      map.addLayer({
        id: "stops-hit",
        type: "circle",
        source: "stops",
        paint: {
          "circle-radius": 16,
          "circle-color": "#000000",
          "circle-opacity": 0,
        },
      });
      map.addLayer({
        id: "stops-fill",
        type: "circle",
        source: "stops",
        paint: {
          "circle-radius": 7,
          "circle-color": "#d4d4cf",
          "circle-stroke-width": 1,
          "circle-stroke-color": "#5c5c56",
          "circle-opacity": 0.95,
        },
      });
      map.addSource("user", { type: "geojson", data: emptyFC() });
      map.addLayer({
        id: "user-accuracy",
        type: "fill",
        source: "user",
        filter: ["==", ["get", "kind"], "accuracy"],
        paint: { "fill-color": "#2a7fff", "fill-opacity": 0.08 },
      });
      map.addLayer({
        id: "user-accuracy-line",
        type: "line",
        source: "user",
        filter: ["==", ["get", "kind"], "accuracy"],
        paint: { "line-color": "#2a7fff", "line-width": 1 },
      });
      map.addLayer({
        id: "user-dot",
        type: "circle",
        source: "user",
        filter: ["==", ["get", "kind"], "you"],
        paint: {
          "circle-radius": 8,
          "circle-color": "#2a7fff",
          "circle-stroke-width": 2,
          "circle-stroke-color": "#ffffff",
        },
      });
      map.on("mouseenter", "stops-hit", () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "stops-hit", () => {
        map.getCanvas().style.cursor = "";
      });
      map.on("click", (e) => {
        const hits = map.queryRenderedFeatures(e.point, { layers: ["stops-hit", "stops-fill", "user-dot"] });
        if (!hits.length) {
          closeStopPopup();
          return;
        }
        const hit = hits[0];
        if (hit.layer.id === "user-dot") {
          new maplibregl.Popup({ offset: 12, closeButton: false })
            .setLngLat(e.lngLat)
            .setText("You")
            .addTo(map);
          return;
        }
        try {
          const s = JSON.parse(hit.properties.payload);
          openStopPopup(s, e.lngLat);
        } catch (err) {
          console.error(err);
        }
      });
      overlaysReady = true;
    }

    function whenMapReady() {
      return new Promise((resolve) => {
        if (map.isStyleLoaded()) resolve();
        else map.once("load", resolve);
      });
    }

    async function boot() {
      protoRoot = protobuf.parse(PROTO).root;
      HomeStopsType = protoRoot.lookupType("ro.radcom.rp.protofiles.generate.ResponseGetHomeStopsDTO");
      LineDetailType = protoRoot.lookupType("ro.radcom.rp.protofiles.generate.ResponseGetLineDTO");
      VehiclesType = protoRoot.lookupType("ro.radcom.rp.protofiles.generate.ResponseGetVehiclesDTO");

      map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/liberty",
        center: [CITY.lng, CITY.lat],
        zoom: CITY.zoom,
        minZoom: MIN_ZOOM,
        maxZoom: 19,
        pitchWithRotate: false,
        attributionControl: false,
      });
      window.__map = map;
      map.dragRotate.disable();
      if (map.touchPitch) map.touchPitch.disable();
      if (map.touchZoomRotate) map.touchZoomRotate.disableRotation();
      map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-left");
      map.addControl(new maplibregl.NavigationControl({ showCompass: false, visualizePitch: false }), "bottom-right");
      await whenMapReady();
      ensureOverlayLayers();
      map.resize();
      syncMapPadding();
      if (window.ResizeObserver) {
        new ResizeObserver(() => syncMapPadding()).observe(hudEl);
      }
      window.addEventListener("resize", () => {
        map.resize();
        syncMapPadding();
      });

      await ensureToken();
      setStatus("Requesting location…");
      const loc = await locate();
      setUserLoc(loc.lat, loc.lng, loc.acc);
      map.jumpTo({ center: [loc.lng, loc.lat], zoom: CITY.zoom });
      map.resize();
      if (loc.fallback) setStatus("Location fallback: București center (" + loc.reason + ")", "warn");

      map.on("moveend", () => {
        clearTimeout(moveTimer);
        moveTimer = setTimeout(loadStops, 250);
      });

      if (map.getZoom() < MIN_ZOOM) map.setZoom(MIN_ZOOM);
      const bootHashId = lineIdFromHash();
      if (bootHashId) selectedLineId = bootHashId;
      window.addEventListener("hashchange", () => {
        applyLineFromHash();
      });
      await loadStops();
      await applyLineFromHash();
    }

    boot().catch((e) => {
      console.error(e);
      setStatus(e.message || String(e), "err");
    });
  </script>
</body>
</html>
